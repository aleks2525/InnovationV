<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#476BF0"/>
      <stop offset="100%" stop-color="#00D2FB"/>
    </linearGradient>
  </defs>
  <!-- Радар-круги -->
  <circle cx="18" cy="18" r="16" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.3"/>
  <circle cx="18" cy="18" r="11" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.5"/>
  <circle cx="18" cy="18" r="6" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.8"/>
  <!-- Центр (точка сигнала) -->
  <circle cx="18" cy="18" r="2.5" fill="url(#g)"/>
  <!-- Луч радара -->
  <line x1="18" y1="18" x2="30" y2="10" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Точки сигналов -->
  <circle cx="26" cy="12" r="1.5" fill="#00D2FB"/>
  <circle cx="10" cy="24" r="1.2" fill="#476BF0"/>
  <circle cx="28" cy="26" r="1" fill="#00D2FB" opacity="0.7"/>
</svg>
